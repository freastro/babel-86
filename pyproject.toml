[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babel86"
dynamic = ["version"]
description = "Live AI translation box with a 1980s rack-gear UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregory Hart" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
babel86 = "babel86.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/babel86/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
